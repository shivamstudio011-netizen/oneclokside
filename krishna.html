<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hare Krishna</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: linear-gradient(135deg,#ff9933,#ffd700,#fff8dc);
    font-family: Arial, sans-serif;
    text-align:center;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background: rgba(0,0,0,0.4);
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 30px gold;
}

img{
    width:250px;
    border-radius:20px;
    box-shadow:0 0 25px gold;
    margin:20px 0;
}

h1{
    font-size:42px;
    color:#fff;
    text-shadow:0 0 15px yellow;
}

p{
    font-size:22px;
    margin-bottom:20px;
}

audio{
    width:100%;
}
</style>
</head>

<body>

<div class="container">

<h1>🪔 Hare Krishna 🪔</h1>

<img src="krishna.jpg" alt="Lord Krishna">

<p>
Hare Krishna Hare Krishna<br>
Krishna Krishna Hare Hare<br><br>

Hare Rama Hare Rama<br>
Rama Rama Hare Hare
</p>

<audio controls autoplay loop>
    <source src="hare-krishna.mp3" type="audio/mpeg">
    Your browser does not support audio.
</audio>

</div>

</body>
</html>
